[project]
name = "hackathon"
version = "0.1.0"
description = "Evaluation harness for Qwen3.5-35B-A3B inference engine hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "lm-eval[api]>=0.4.4",
    "transformers>=4.45",
    "tabulate",
    "tqdm",
    "numpy",
]

[project.optional-dependencies]
baseline = ["vllm>=0.8"]
# cloudbench is a zero-dependency control plane (pure stdlib). PyYAML is purely
# optional — it gives nicer YAML parsing; without it a stdlib fallback is used.
# Kept OUT of [project.dependencies] so orchestrating cloud runs never drags in
# the heavy ML stack, and vice versa.
cloudbench = ["pyyaml>=6"]

# Dev-only tooling (PEP 735 dependency group). Installed via `uv sync --group dev`
# or `uv run --group dev ...`; never shipped as a project dependency.
[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["eval*", "cloudbench*"]

[project.scripts]
check-server = "eval.check_server:main"
run-correctness = "eval.correctness.run_correctness:main"
run-throughput = "eval.throughput.run_throughput:main"
cloudbench = "cloudbench.cli:main"
